<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Register</title>
</head>

<body>
    <section class=" bg-success bg-gradient border border-3 p-3 roundedr m-3">
        <h2 class="text-center">Regitration</h2>
        <form class="row g-3">
            <div class="mb-3 ">
                <label for="validationDefault01" class="form-label">Username</label>
                <input type="text" class="form-control" id="validationDefault01" value="">
            </div>
            <div>
                <div class="mb-3 ">
                    <label for="email" class="col-form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" value="">

                </div>
                <div class="mb-3">
                    <label for="email" class="col-form-label">Repeat Email</label>
                    <input type="email" class="form-control" id="email" value="">
                </div>
            </div>
            <div>
                <div>
                    <label for="inputPassword6" class="col-form-label">Password</label>
                </div>
                <div class="input-group mb-3">
                    <input class="form-control" type="password" name="password" id="password" />
                    <button onclick="toggle()" class="bi bi-eye-slash" id="togglePassword" type="button"></button>

                </div>
            </div>
            <div class=" mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
                    <label class="form-check-label" for="invalidCheck2">
                        Agree to terms and conditions
                    </label>
                </div>
            </div>
            <div class=" mb-3">
                <button id="Register" type="submit" class="btn btn-primary mb-3">Register</button>
            </div>
        </form>
    </section>
    <section class="text-center">
        <p>Already have an account?</p>
        <p>Log in here</p>
        <button id="LoginButton" class="btn btn-primary" type="button">Login</button>
    </section>
    <script src="renderer.js"></script>
</body>

</html>
