<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Login</title>
</head>

<body class="mb-3">
    <section class="m-3  bg-success bg-gradient border border-3 p-3 rounded">
        <h2 class="text-center">Login</h2>
        <form class="row g-3">

            <div>
                <label for="validationDefaultEmail" class="form-label">Email Adress</label>
                <div class="input-group">
                    <input type="email" class="form-control" id="validationDefaultEmail"
                        aria-describedby="inputGroupPrepend2" required>
                </div>

            </div>
            <div>
                <div>
                    <label for="inputPassword6" class="form-label">Password</label>
                </div>
                <div class="input-group mb-3">
                    <input class="form-control" type="password" name="password" id="password" />
                    <button onclick="toggle()" class="bi bi-eye-slash" id="togglePassword" type="button"></button>

                </div>
            </div>
            <div class="d-flex justify-content-center">
                <button class="btn btn-primary" type="submit">Login</button>
            </div>
        </form>
    </section>

    <section class="text-center">
        <p>Don't have an account yet? </p>
        <p>Register here.</p>
        <button id="RegisterButton" class="btn btn-primary" type="button">Register</button>
    </section>
    <script src="renderer.js"></script>

</body>

</html>
